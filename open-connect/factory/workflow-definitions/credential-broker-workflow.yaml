# Open Connect AI Factory — Workflow Definition: Credential Broker Setup
# Configure scoped credential access for agents.
version: "1.0"
workflow_id: credential-broker-v1
name: Credential Broker Setup
description: Configure scoped runtime access to credentials without exposing raw secrets.
agent: custom-agent-factory
timeout_seconds: 900

steps:
  - id: step-1-register-vaults
    name: Register Credential Vaults
    skill: skill-credential-broker-setup
    action: register_credential_vaults
    timeout: 60
    required: true
    outputs:
      - vaults_registered

  - id: step-2-define-scopes
    name: Define Agent Scopes
    skill: skill-credential-broker-setup
    action: define_agent_scopes
    timeout: 30
    required: true
    depends_on: [step-1-register-vaults]
    outputs:
      - scope_definitions

  - id: step-3-setup-rotation
    name: Configure Secret Rotation
    skill: skill-credential-broker-setup
    action: configure_secret_rotation
    timeout: 60
    required: true
    depends_on: [step-2-define-scopes]
    outputs:
      - rotation_config

failure_handling:
  on_step_failure:
    max_repair_attempts: 3
    notify_admin: true

success_actions:
  - archive_audit_evidence
