# Open Connect AI Factory — Credential Broker
# Scoped runtime access to credentials without exposing raw secrets.
version: "1.0"
factory: hillstreet-open-connect
updated: "2026-11-25"

vaults:
  - id: open-connect-credentials
    name: Open Connect Credentials
    type: central_registry
    provider: open_connect
    role: integration_credential_broker
    status: active

  - id: composio
    name: Composio
    type: oauth_manager
    provider: composio
    role: managed_oauth_connections
    status: available

  - id: onepassword
    name: 1Password
    type: password_vault
    provider: agilebits
    role: infrastructure_service_credentials
    status: pending_integration

  - id: proton-pass
    name: Proton Pass
    type: password_vault
    provider: proton
    role: personal_password_vault
    status: pending_integration

  - id: github-secrets
    name: GitHub Secrets
    type: ci_cd_secrets
    provider: github
    role: ci_cd_execution_credentials
    status: configured

  - id: railway-variables
    name: Railway Variables
    type: runtime_secrets
    provider: railway
    role: application_runtime_secrets
    status: configured

  - id: cloudflare-secrets
    name: Cloudflare Secrets
    type: runtime_secrets
    provider: cloudflare
    role: cloudflare_runtime_credentials
    status: configured

  - id: supabase-vault
    name: Supabase Vault
    type: database_secrets
    provider: supabase
    role: database_related_secrets
    status: configured

  - id: databricks-secrets
    name: Databricks Secrets
    type: data_processing_secrets
    provider: databricks
    role: data_processing_credentials
    status: pending_integration

credential_scopes:
  - scope: github_actions
    vault: github-secrets
    agents:
      - kilo-code
      - custom-agent-factory
    expiration_days: 90

  - scope: railway_deploy
    vault: railway-variables
    agents:
      - custom-agent-factory
    expiration_days: 90

  - scope: cloudflare_runtime
    vault: cloudflare-secrets
    agents:
      - custom-agent-factory
    expiration_days: 90

  - scope: supabase_database
    vault: supabase-vault
    agents:
      - custom-agent-factory
    expiration_days: 90

  - scope: sentry_monitoring
    vault: open-connect-credentials
    agents:
      - sentry-seer
    expiration_days: 90

  - scope: linear_project
    vault: open-connect-credentials
    agents:
      - linear-ai
    expiration_days: 90

  - scope: notion_documentation
    vault: open-connect-credentials
    agents:
      - notion-ai
    expiration_days: 90

broker_rules:
  - rule: scoped_access_only
    description: Agents receive only the specific access necessary for their tasks.
    enforced: true
  - rule: no_vault_synchronization
    description: Do not synchronize every password vault with every AI agent.
    enforced: true
  - rule: expiration_tracking
    description: All credentials have expiration tracking and audit records.
    enforced: true
  - rule: rotation_required
    description: Production secrets must be rotated regularly.
    enforced: true

audit:
  enabled: true
  log_all_access: true
  retention_days: 90
