# Open Connect AI Factory — Credential Vaults
# Secret Manager, Open Connect Credentials, Proton Pass, 1Password.
version: "1.0"
updated: "2026-11-25"

vaults:
  - id: open-connect-credentials
    name: Open Connect Credentials
    type: central_integration_registry
    provider: open_connect
    role: integration_credential_registry_and_broker
    status: active
    scope: all_integrations

  - id: composio
    name: Composio
    type: oauth_application_connections
    provider: composio
    role: managed_oauth_and_application_connections
    status: available
    scope: oauth_flows

  - id: onepassword
    name: 1Password
    type: password_vault
    provider: agilebits
    role: infrastructure_and_service_credentials
    status: pending_integration
    scope: service_accounts

  - id: proton-pass
    name: Proton Pass
    type: password_vault
    provider: proton
    role: personal_password_vault
    status: pending_integration
    scope: personal_credentials

  - id: github-secrets
    name: GitHub Secrets
    type: ci_cd_execution_credentials
    provider: github
    role: ci_cd_execution_credentials
    status: configured
    scope: repository_actions

  - id: railway-variables
    name: Railway Variables
    type: application_runtime_secrets
    provider: railway
    role: application_runtime_secrets
    status: configured
    scope: railway_projects

  - id: cloudflare-secrets
    name: Cloudflare Secrets
    type: cloudflare_runtime_credentials
    provider: cloudflare
    role: cloudflare_runtime_credentials
    status: configured
    scope: cloudflare_projects

  - id: supabase-vault
    name: Supabase Vault
    type: database_related_secrets
    provider: supabase
    role: database_related_secrets
    status: configured
    scope: supabase_projects

  - id: databricks-secrets
    name: Databricks Secrets
    type: data_processing_credentials
    provider: databricks
    role: data_processing_credentials
    status: pending_integration
    scope: databricks_workspaces

broker_rules:
  - rule: scoped_access_only
    description: Agents receive only the specific access necessary for their tasks.
    enforced: true
  - rule: no_vault_synchronization
    description: Do not synchronize every password vault with every AI agent.
    enforced: true
  - rule: credential_references_only
    description: Maintain credential references, scoped permissions, expiration tracking, and audit records.
    enforced: true
  - rule: rotation_required
    description: Infrastructure and service credentials must be rotated regularly.
    enforced: true
