name: Deploy All (Pages + Workers) Smoke Check

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-all-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for deployments
        run: sleep 30

      - name: Full smoke check
        run: |
          echo "=== Pages ==="
          for path in "" "/auth" "/admin"; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://masterkanorcase.online${path}")
            echo "https://masterkanorcase.online${path}: ${status}"
          done
          echo "=== Workers ==="
          for path in "/health"; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://api.masterkanorcase.online${path}" || echo "000")
            echo "https://api.masterkanorcase.online${path}: ${status}"
          done
          echo "All smoke checks complete."