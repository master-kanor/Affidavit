name: Configure DNS-AID records

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns-aid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create DNS-AID records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=masterkanorcase.online" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result[0].id')
          echo "Zone ID: ${ZONE_ID}"
          create() {
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$1" | jq -c '{success,errors}'
          }
          for host in _index._agents _a2a._agents _mcp._agents; do
            fqdn="${host}.masterkanorcase.online"
            create "{\"type\":\"HTTPS\",\"name\":\"${fqdn}\",\"content\":\"1 .\",\"ttl\":300}"
            create "{\"type\":\"SVCB\",\"name\":\"${fqdn}\",\"content\":\"1 .\",\"ttl\":300}"
          done
          create "{\"type\":\"TXT\",\"name\":\"_index._agents.masterkanorcase.online\",\"content\":\"v=aid1\",\"ttl\":300}"