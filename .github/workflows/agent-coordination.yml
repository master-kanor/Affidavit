name: Agent coordination
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [Pull Request Validation]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: agent-coordination-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  coordinate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          TRUSTED_AGENT_BOT_IDS: ${{ vars.TRUSTED_AGENT_BOT_IDS }}
        with:
          script: |
            await require('./scripts/automation/coordinate.cjs')({github, context, core});
  guarded-merge:
    if: vars.AGENT_AUTO_MERGE_ENABLED == 'true' && (github.event_name == 'pull_request_review' || github.event_name == 'workflow_run' || github.event_name == 'issue_comment')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Require existing authorized automation identity
        env:
          AUTOMATION_TOKEN: ${{ secrets.AGENT_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$AUTOMATION_TOKEN" ]; then
            echo '::error::Automatic merge blocked: no existing authorized GitHub App token configured'
            exit 1
          fi
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AGENT_AUTOMATION_TOKEN }}
          script: |
            await require('./scripts/automation/merge-gate.cjs')({github, context, core});
