name: Deploy — Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        run: railway up --project master-runner --detach
      - name: Health Check
        run: |
          curl -f https://master-runner.up.railway.app/health || exit 1
      - name: Notify on Failure
        if: failure()
        run: |
          echo "Deployment failed — creating Linear issue and Sentry alert"
