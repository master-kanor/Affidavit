name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '9'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm run check

      - name: Build application
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: affidavit
          directory: dist
          productionBranch: main

      - name: Smoke Check
        run: |
          sleep 30
          for i in {1..5}; do
            if curl -f -sS https://masterkanorcase.online/ >/dev/null; then
              echo "✅ Homepage smoke check passed"
              exit 0
            fi
            echo "Homepage smoke check attempt $i failed, retrying..."
            sleep 10
          done
          echo "❌ Homepage smoke check failed"
          exit 1

      - name: Notify Success
        if: success()
        run: echo "✅ Deployment successful to https://masterkanorcase.online"

      - name: Notify Failure
        if: failure()
        run: echo "❌ Deployment failed"
