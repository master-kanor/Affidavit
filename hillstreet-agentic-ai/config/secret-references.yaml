# Secret References
# Credential reference registry — NEVER store raw secrets here

vaults:
  - id: open-connect-credentials
    name: Open Connect Credentials
    type: central_registry
    status: active

  - id: composio
    name: Composio
    type: oauth_manager
    status: available

  - id: onepassword
    name: 1Password
    type: password_vault
    status: pending_integration

  - id: proton-pass
    name: Proton Pass
    type: password_vault
    status: pending_integration

  - id: github-secrets
    name: GitHub Secrets
    type: ci_cd_secrets
    status: configured

  - id: railway-variables
    name: Railway Variables
    type: runtime_secrets
    status: configured

  - id: cloudflare-secrets
    name: Cloudflare Secrets
    type: runtime_credentials
    status: configured

  - id: supabase-vault
    name: Supabase Vault
    type: database_secrets
    status: configured

  - id: databricks-secrets
    name: Databricks Secrets
    type: data_processing_secrets
    status: pending_integration

credential_scopes:
  - scope: github_actions
    vault: github-secrets
    agents: [kilo-code, custom-agent-factory]
    expiration_days: 90

  - scope: railway_deploy
    vault: railway-variables
    agents: [custom-agent-factory]
    expiration_days: 90

  - scope: cloudflare_runtime
    vault: cloudflare-secrets
    agents: [custom-agent-factory]
    expiration_days: 90

  - scope: supabase_database
    vault: supabase-vault
    agents: [custom-agent-factory]
    expiration_days: 90

  - scope: sentry_monitoring
    vault: open-connect-credentials
    agents: [sentry-seer]
    expiration_days: 90

  - scope: linear_project
    vault: open-connect-credentials
    agents: [linear-ai]
    expiration_days: 90

  - scope: notion_documentation
    vault: open-connect-credentials
    agents: [notion-ai]
    expiration_days: 90

rules:
  - rule: scoped_access_only
    description: Agents receive only the specific access necessary for their tasks.
    enforced: true
  - rule: no_vault_synchronization
    description: Do not synchronize every password vault with every AI agent.
    enforced: true
  - rule: credential_references_only
    description: Maintain credential references, scoped permissions, expiration tracking, and audit records.
    enforced: true
  - rule: rotation_required
    description: Production secrets must be rotated regularly.
    enforced: true